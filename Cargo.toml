[package]
name = "r3viewer"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Visor de documentos y datos integrado con Nushell"

[[bin]]
name = "r3viewer"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
ctrlc = "3.5"
unicode-width = "0.2"
unicode-segmentation = "1.12"
