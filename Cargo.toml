[package]
name = "r3viewer"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Visor de documentos y datos integrado con Nushell"

[[bin]]
name = "r3viewer"
path = "src/main.rs"

[dependencies]
r3viewer-wire = { path = "crates/wire" }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
ctrlc = "3.5"
unicode-width = "0.2"
unicode-segmentation = "1.12"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
toml_edit = { version = "=0.25.15", default-features = false, features = ["parse"] }
toml_parser = "=1.1.3"
jiter = { version = "=0.17.0", default-features = false }

[build-dependencies]
syntect = { version = "=5.3.0", default-features = false, features = ["default-syntaxes", "yaml-load", "dump-create", "regex-fancy"] }

[target.'cfg(windows)'.dependencies]
syntect = { version = "=5.3.0", default-features = false, features = ["default-syntaxes", "regex-onig"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[workspace]
members = [".", "crates/wire", "crates/nu-plugin"]
exclude = ["vendor/nushell", "vendor/crossterm", "vendor/jiter", ".tmp/*"]
resolver = "3"

[patch.crates-io]
jiter = { path = "vendor/jiter" }
nu-plugin = { path = "vendor/nushell/nu-plugin" }
nu-plugin-core = { path = "vendor/nushell/nu-plugin-core" }

crossterm = { path = "vendor/crossterm" }
